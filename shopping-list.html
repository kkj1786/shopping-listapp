<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쇼핑 리스트</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        header {
            background: #667eea;
            color: white;
            padding: 24px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .item-count {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .input-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .input-section input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .input-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-section button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-section button:hover {
            background: #5a6fd6;
        }

        .shopping-list {
            list-style: none;
            max-height: 400px;
            overflow-y: auto;
        }

        .shopping-list li {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .shopping-list li:hover {
            background: #f9f9f9;
        }

        .shopping-list li.checked {
            background: #f5f5f5;
        }

        .shopping-list li.checked .item-text {
            text-decoration: line-through;
            color: #999;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #ddd;
            border-radius: 50%;
            margin-right: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .checkbox:hover {
            border-color: #667eea;
        }

        .checkbox.checked {
            background: #667eea;
            border-color: #667eea;
        }

        .checkbox.checked::after {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        .item-text {
            flex: 1;
            font-size: 1rem;
            color: #333;
        }

        .delete-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: #ccc;
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: #ffebee;
            color: #e53935;
        }

        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: #999;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        footer {
            padding: 16px;
            text-align: center;
            border-top: 1px solid #eee;
        }

        .clear-all {
            padding: 10px 20px;
            background: transparent;
            border: 2px solid #e53935;
            color: #e53935;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .clear-all:hover {
            background: #e53935;
            color: white;
        }

        .clear-all:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>쇼핑 리스트</h1>
            <p class="item-count"><span id="remaining">0</span>개 남음 / 총 <span id="total">0</span>개</p>
        </header>

        <div class="input-section">
            <input type="text" id="itemInput" placeholder="아이템을 입력하세요..." autofocus>
            <button onclick="addItem()">추가</button>
        </div>

        <ul class="shopping-list" id="shoppingList"></ul>

        <footer>
            <button class="clear-all" onclick="clearAll()" id="clearBtn">모두 삭제</button>
        </footer>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('shoppingList')) || [];

        function saveItems() {
            localStorage.setItem('shoppingList', JSON.stringify(items));
        }

        function renderList() {
            const list = document.getElementById('shoppingList');
            const remaining = document.getElementById('remaining');
            const total = document.getElementById('total');
            const clearBtn = document.getElementById('clearBtn');

            if (items.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>리스트가 비어있습니다</p></div>';
            } else {
                list.innerHTML = items.map((item, index) => `
                    <li class="${item.checked ? 'checked' : ''}">
                        <div class="checkbox ${item.checked ? 'checked' : ''}" onclick="toggleItem(${index})"></div>
                        <span class="item-text">${escapeHtml(item.text)}</span>
                        <button class="delete-btn" onclick="deleteItem(${index})">&times;</button>
                    </li>
                `).join('');
            }

            const uncheckedCount = items.filter(item => !item.checked).length;
            remaining.textContent = uncheckedCount;
            total.textContent = items.length;
            clearBtn.disabled = items.length === 0;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function addItem() {
            const input = document.getElementById('itemInput');
            const text = input.value.trim();

            if (text) {
                items.unshift({ text, checked: false });
                saveItems();
                renderList();
                input.value = '';
                input.focus();
            }
        }

        function deleteItem(index) {
            items.splice(index, 1);
            saveItems();
            renderList();
        }

        function toggleItem(index) {
            items[index].checked = !items[index].checked;
            saveItems();
            renderList();
        }

        function clearAll() {
            if (items.length > 0 && confirm('모든 아이템을 삭제하시겠습니까?')) {
                items = [];
                saveItems();
                renderList();
            }
        }

        // Enter 키로 아이템 추가
        document.getElementById('itemInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addItem();
            }
        });

        // 초기 렌더링
        renderList();
    </script>
</body>
</html>
